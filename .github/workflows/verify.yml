name: verify

on:
  pull_request:
  push:
    branches: [main, "sprint/**"]

jobs:
  # Docs-only changes start no CI run (docs get push, merge and publish only).
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # code=false only when every changed file is docs. Anything unknown counts as code.
          docs_re='(\.(md|mdx|rst|docx|pdf)$)|(^|/)(LICENSE|NOTICE)(\.[^/]*)?$|^docs/.*\.(png|jpe?g|svg|gif|webp|html|css)$'
          keep_re='(^|/)SKILL\.md$|(^|/)(skills|agents|commands|prompts|references)/|^\.claude/'
          files=""
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq 'if (.files | length) >= 300 then empty else .files[].filename end') || files=""
          fi
          code=true
          if [ -n "$files" ]; then
            other=$(printf '%s\n' "$files" | grep -Ev "$docs_re" || true)
            kept=$(printf '%s\n' "$files" | grep -E "$docs_re" | grep -E "$keep_re" || true)
            if [ -z "$other" ] && [ -z "$kept" ]; then code=false; fi
          fi
          echo "Changed files:"; printf '%s\n' "$files" | head -50
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  verify-docs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install CivicCore shared-ingestion dependency
        run: python -m pip install "civiccore @ git+https://github.com/townlight/core.git@90ec5417d37d469f2cf01d26ace393f67504a805"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Collect product pytest count
        run: |
          set -o pipefail
          python -m pytest --collect-only -q --ignore=tests/test_release_provenance_gate.py 2>&1 | tee pytest-product-collect.log
      - name: Run product tests against CivicCore shared-ingestion dependency
        run: |
          set -o pipefail
          python -m pytest --ignore=tests/test_release_provenance_gate.py 2>&1 | tee pytest-product-run.log
      - name: Verify product collected == passed or reported skips
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          collect_log = Path("pytest-product-collect.log").read_text(encoding="utf-8", errors="replace")
          run_log = Path("pytest-product-run.log").read_text(encoding="utf-8", errors="replace")

          collected_matches = re.findall(r"(\d+)\s+tests?\s+collected", collect_log)
          if not collected_matches:
              print("::error::Could not parse pytest collection count from pytest-product-collect.log.")
              sys.exit(1)
          collected = int(collected_matches[-1])

          summary_matches = re.findall(
              r"=+\s*([^=\n]*\b(?:passed|failed|error|skipped|xfailed|xpassed|deselected)\b[^=\n]*)\s*=+",
              run_log,
          )
          if not summary_matches:
              print("::error::Could not parse pytest result summary from pytest-product-run.log.")
              sys.exit(1)
          summary = summary_matches[-1]

          def count(label: str) -> int:
              match = re.search(rf"(\d+)\s+{label}", summary)
              return int(match.group(1)) if match else 0

          passed = count("passed")
          skipped = count("skipped")
          deselected = count("deselected")
          failed = count("failed")
          errors = count("errors?")
          xfailed = count("xfailed")
          xpassed = count("xpassed")
          accounted = passed + skipped + deselected

          print(f"collected={collected}")
          print(f"passed={passed}")
          print(f"skipped={skipped}")
          print(f"deselected={deselected}")
          if failed or errors or xfailed or xpassed:
              print(
                  f"::error::Unexpected pytest non-pass outcomes: failed={failed} "
                  f"errors={errors} xfailed={xfailed} xpassed={xpassed}."
              )
              sys.exit(1)
          if collected != accounted:
              print(
                  f"::error::Collection/run mismatch: collected={collected} "
                  f"accounted={accounted} passed={passed} skipped={skipped} deselected={deselected}."
              )
              print("::error::Investigate silent test loss, early exit, or unreported pytest outcomes.")
              sys.exit(1)
          if collected != passed:
              print(
                  f"::notice::Collected count differs from passed only by reported skips/deselections "
                  f"(skipped={skipped}, deselected={deselected})."
              )
          PY
      - name: Collect release-provenance pytest count
        run: |
          set -o pipefail
          python -m pytest tests/test_release_provenance_gate.py --collect-only -q 2>&1 | tee pytest-provenance-collect.log
      - name: Run release-provenance tooling tests against CivicCore shared-ingestion dependency
        run: |
          python -m pip install --force-reinstall "civiccore @ https://github.com/townlight/core/releases/download/v1.2.1/civiccore-1.2.1-py3-none-any.whl#sha256=8dde29408e206048bde63ec14156a8e6329382af4d16b12710d12aa5c27f3f59"
          set -o pipefail
          python -m pytest tests/test_release_provenance_gate.py 2>&1 | tee pytest-provenance-run.log
      - name: Verify release-provenance collected == passed or reported skips
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          collect_log = Path("pytest-provenance-collect.log").read_text(encoding="utf-8", errors="replace")
          run_log = Path("pytest-provenance-run.log").read_text(encoding="utf-8", errors="replace")

          collected_matches = re.findall(r"(\d+)\s+tests?\s+collected", collect_log)
          if not collected_matches:
              print("::error::Could not parse pytest collection count from pytest-provenance-collect.log.")
              sys.exit(1)
          collected = int(collected_matches[-1])

          summary_matches = re.findall(
              r"=+\s*([^=\n]*\b(?:passed|failed|error|skipped|xfailed|xpassed|deselected)\b[^=\n]*)\s*=+",
              run_log,
          )
          if not summary_matches:
              print("::error::Could not parse pytest result summary from pytest-provenance-run.log.")
              sys.exit(1)
          summary = summary_matches[-1]

          def count(label: str) -> int:
              match = re.search(rf"(\d+)\s+{label}", summary)
              return int(match.group(1)) if match else 0

          passed = count("passed")
          skipped = count("skipped")
          deselected = count("deselected")
          failed = count("failed")
          errors = count("errors?")
          xfailed = count("xfailed")
          xpassed = count("xpassed")
          accounted = passed + skipped + deselected

          print(f"collected={collected}")
          print(f"passed={passed}")
          print(f"skipped={skipped}")
          print(f"deselected={deselected}")
          if failed or errors or xfailed or xpassed:
              print(
                  f"::error::Unexpected pytest non-pass outcomes: failed={failed} "
                  f"errors={errors} xfailed={xfailed} xpassed={xpassed}."
              )
              sys.exit(1)
          if collected != accounted:
              print(
                  f"::error::Collection/run mismatch: collected={collected} "
                  f"accounted={accounted} passed={passed} skipped={skipped} deselected={deselected}."
              )
              print("::error::Investigate silent test loss, early exit, or unreported pytest outcomes.")
              sys.exit(1)
          if collected != passed:
              print(
                  f"::notice::Collected count differs from passed only by reported skips/deselections "
                  f"(skipped={skipped}, deselected={deselected})."
              )
          PY
      - name: Verify docs
        run: bash scripts/verify-docs.sh
      - name: Check CivicCore placeholder imports
        run: python scripts/check-civiccore-placeholder-imports.py
      - name: Install Playwright browser dependency
        timeout-minutes: 10
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install chromium
      - name: Run staff browser QA
        run: node scripts/browser-staff-surfaces-qa.cjs
      - name: Run public browser QA
        run: node scripts/browser-public-surfaces-qa.cjs
      - name: Verify release packaging gate
        run: |
          python -m ruff check .
          npm ci
          npm run typecheck
          npm run build
          npx playwright install chromium
          npm run a11y:ci
          python -m build
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import tomllib

          dist = Path("dist")
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          wheel = dist / f"civiccode-{version}-py3-none-any.whl"
          sdist = dist / f"civiccode-{version}.tar.gz"
          assert wheel.exists(), f"missing {wheel}"
          assert sdist.exists(), f"missing {sdist}"
          lines = []
          for path in [wheel, sdist]:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}\n")
          (dist / "SHA256SUMS.txt").write_text("".join(lines), encoding="utf-8")
          print("PASS: build artifacts and SHA256SUMS.txt created")
          PY
          echo "VERIFY-RELEASE: PASSED"
