name: verify

on:
  pull_request:
  push:
    branches: [main, "sprint/**"]

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install CivicCore release wheel
        run: python -m pip install https://github.com/CivicSuite/civiccore/releases/download/v1.1.0/civiccore-1.1.0-py3-none-any.whl
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run product tests against published CivicCore
        run: python -m pytest --ignore=tests/test_release_provenance_gate.py
      - name: Run release-provenance tooling tests against published CivicCore
        run: |
          python -m pip install --force-reinstall https://github.com/CivicSuite/civiccore/releases/download/v1.1.0/civiccore-1.1.0-py3-none-any.whl
          python -m pytest tests/test_release_provenance_gate.py
      - name: Verify docs
        run: bash scripts/verify-docs.sh
      - name: Check CivicCore placeholder imports
        run: python scripts/check-civiccore-placeholder-imports.py
      - name: Install Playwright browser dependency
        timeout-minutes: 10
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install chromium
      - name: Run staff browser QA
        run: node scripts/browser-staff-surfaces-qa.cjs
      - name: Run public browser QA
        run: node scripts/browser-public-surfaces-qa.cjs
      - name: Verify release packaging gate
        run: |
          python -m ruff check .
          npm ci
          npm run typecheck
          npm run build
          python -m build
          python - <<'PY'
          from pathlib import Path
          import hashlib

          dist = Path("dist")
          wheel = dist / "civiccode-0.6.0-py3-none-any.whl"
          sdist = dist / "civiccode-0.6.0.tar.gz"
          assert wheel.exists(), f"missing {wheel}"
          assert sdist.exists(), f"missing {sdist}"
          lines = []
          for path in [wheel, sdist]:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}\n")
          (dist / "SHA256SUMS.txt").write_text("".join(lines), encoding="utf-8")
          print("PASS: build artifacts and SHA256SUMS.txt created")
          PY
          echo "VERIFY-RELEASE: PASSED"
