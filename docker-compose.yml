services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-townlight_code}
      POSTGRES_USER: ${POSTGRES_USER:-townlight_code}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-townlight_code-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - townlight_code-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://townlight_code:townlight_code-local-only@postgres:5432/townlight_code}
      TOWNLIGHT_CODE_SOURCE_REGISTRY_DB_URL: ${TOWNLIGHT_CODE_SOURCE_REGISTRY_DB_URL:-postgresql+psycopg2://townlight_code:townlight_code-local-only@postgres:5432/townlight_code}
      TOWNLIGHT_CODE_DEMO_SEED: ${TOWNLIGHT_CODE_DEMO_SEED:-1}
      TOWNLIGHT_CODE_DEMO_ACTOR: ${TOWNLIGHT_CODE_DEMO_ACTOR:-demo-seed@portland.example.gov}
      TOWNLIGHT_CODE_STAFF_TRUSTED_PROXY_CIDRS: ${TOWNLIGHT_CODE_STAFF_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      TOWNLIGHT_CODE_INTAKE_SECRET: ${TOWNLIGHT_CODE_INTAKE_SECRET:-}
    ports:
      - "127.0.0.1:${TOWNLIGHT_CODE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  townlight_code-postgres-data:
